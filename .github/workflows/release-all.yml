name: Build All & Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-all-release
  cancel-in-progress: false

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.continue-on-error || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            upload_pattern: 'release/*.exe'
          # macos-latest 与 macos-15 两轮都没抢到 hosted runner
          # （"The job was not acquired by Runner of type hosted"），换 macos-14 的池子再试；
          # 它的失败不挡住 Windows/Linux 发版（release 作业因此用 always()）。
          - os: macos-14
            target: --mac
            upload_pattern: 'release/*.dmg'
            continue-on-error: true
          - os: ubuntu-latest
            target: --linux
            upload_pattern: 'release/*.tar.gz'

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Rust toolchain
        if: runner.os == 'Linux' || runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache Cargo build
        if: runner.os == 'Linux'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .windowtolayer-src

      - name: Cache wallpaper-helper Cargo build
        if: runner.os == 'Windows'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packaging/windows/wallpaper-helper

      - name: Build windowtolayer from upstream + patch (Linux only)
        if: runner.os == 'Linux'
        run: |
          # Shared with `npm run build:windowtolayer` and the nix package: fetches the pinned
          # upstream source, applies packaging/linux/patches/*.patch and produces
          # build/windowtolayer + build/windowtolayer-COPYING for extraResources.
          # Without this, wallpaper mode silently disables on Linux.
          node packaging/linux/build-windowtolayer.mjs

      - name: Build wallpaper helper (Windows only)
        if: runner.os == 'Windows'
        run: |
          # Builds packaging/windows/wallpaper-helper (WorkerW attach + raw-input mouse forward)
          # into build/folia-wallpaper-helper.exe for the win extraResources. No-op elsewhere.
          node packaging/windows/build-wallpaper-helper.mjs

      - name: Build web app for Electron
        env:
          ELECTRON: 'true'
          APP_VERSION_LABEL: Folia
          APP_RELEASE_CHANNEL: stable
        run: npm run build

      - name: Package Electron app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder ${{ matrix.target }} --publish never

      - name: Package Linux archive
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          cd release
          if [ -d linux-unpacked ]; then
            tar -czf "folia-major-${VERSION}-linux-x64.tar.gz" linux-unpacked
          fi
          ls -la

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/*.yml
            release/*.tar.gz
            release/*.pkg.tar.zst
            !release/builder-debug.yml
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish release
    needs: build
    # build 矩阵里 mac 抢不到 hosted runner 时整个作业是 cancelled，矩阵的
    # continue-on-error 兜不住 needs（run 44759866206：Windows/Linux 都成了，
    # mac cancelled，release 整轮 skipped）。所以这里用 always()，真正的门槛
    # 放到下面的产物检查里：一个包都没有才失败。
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Determine version
        id: meta
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download packaged artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          mapfile -d '' files < <(find artifacts -type f -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::没有任何构建产物，放弃发版"
            exit 1
          fi
          # 安装包清单按实际拿到的产物生成：mac 那一格没抢到 runner 时，
          # 别在发布说明里承诺一个不存在的 dmg。
          assets=""
          for f in "${files[@]}"; do assets+="- $(basename "$f")"$'\n'; done
          gh release delete "${TAG}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes >/dev/null 2>&1 || true
          cat > release-notes.md <<EOF
          Folia fork v${VERSION}

          基于 chthollyphile/folia-major 的个人 fork 构建，包含私房菜定制（播放音源兜底、Nix 打包）。

          ## 安装包

          ${assets}
          ## 构建信息

          - Source: ${GITHUB_SHA}
          - Branch: ${GITHUB_REF_NAME}
          EOF
          gh release create "${TAG}" "${files[@]}" --repo "${GITHUB_REPOSITORY}" --title "Folia ${TAG}" --notes-file release-notes.md --target "${GITHUB_SHA}" --draft
