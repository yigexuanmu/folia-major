name: Probe Token
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Exact release command
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v9.9.9-probe
        run: |
          echo hi > /tmp/asset.txt
          gh release delete "${TAG}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes || echo "delete rc=$?"
          gh release create "${TAG}" /tmp/asset.txt --repo "${GITHUB_REPOSITORY}" --title "probe" --notes "probe" --target "${GITHUB_SHA}" --draft || echo "create rc=$?"
          echo "--- retry without --target ---"
          gh release create "${TAG}x" /tmp/asset.txt --repo "${GITHUB_REPOSITORY}" --title "probe" --notes "probe" --draft || echo "create2 rc=$?"
